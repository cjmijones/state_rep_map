services:
  - type: web
    name: statehouse-atlas
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: state-rep-map-visualizationo
    buildCommand: npm ci --include=dev && npm run build -- --webpack
    startCommand: npm run start -- -p $PORT -H 0.0.0.0
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
